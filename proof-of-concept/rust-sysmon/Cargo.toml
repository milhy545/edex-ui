[package]
name = "edex-sysmon-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
sysinfo = "0.30"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sysmon_benchmark"
harness = false
