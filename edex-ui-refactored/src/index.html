<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eDEX-UI</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1 class="title">eDEX-UI v3.0</h1>
        <p class="subtitle">Tauri + Rust Implementation</p>
      </header>

      <section class="system-info">
        <h2>System Monitor</h2>

        <div class="info-grid">
          <div class="info-card">
            <h3>CPU</h3>
            <div class="value" id="cpu-usage">--</div>
            <div class="label">Usage</div>
          </div>

          <div class="info-card">
            <h3>Memory</h3>
            <div class="value" id="memory-usage">--</div>
            <div class="label">Used / Total</div>
          </div>

          <div class="info-card">
            <h3>Processes</h3>
            <div class="value" id="process-count">--</div>
            <div class="label">Running</div>
          </div>
        </div>

        <div class="controls">
          <button id="refresh-btn" class="btn-primary">Refresh</button>
          <button id="auto-refresh-btn" class="btn-secondary">Auto-Refresh: OFF</button>
        </div>
      </section>

      <section class="test-section">
        <h2>Test Commands</h2>
        <form class="row" id="greet-form">
          <input id="greet-input" placeholder="Enter a name..." />
          <button type="submit">Greet</button>
        </form>
        <p id="greet-msg"></p>
      </section>

      <footer>
        <div class="performance-note">
          🚀 Expected: -85% RAM, -80% CPU vs Electron
        </div>
      </footer>
    </main>
  </body>
</html>
